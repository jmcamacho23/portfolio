name: Run PyWinAuto Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 
jobs:
  pywinauto-ui-tests:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install pytest pytest-asyncio requests pywinauto pywin32 comtypes pytz

    - name: Run PyWinAuto Tests
      run: |
        pytest tests/win --junit-xml=reports/windows-report.xml -o junit_logging=all
      if: always()

    - name: Upload Windows Test Report XML
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-report-xml
        path: reports/windows-report.xml

        
