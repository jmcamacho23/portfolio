name: Run PyWinAuto Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 
jobs:
  ui-tests:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 2. Crucial Step: Use a helper to force an interactive/GUI session.
    # This prevents the Windows runner from hiding the GUI layer.
    - name: Run PyWinAuto Tests in Interactive Session
      uses: bitovi/github-actions-storybook-to-ghpages@v1
      with:
        run: |
          pytest tests/win --headed --junit-xml=reports/windows-report.xml -o junit_logging=all
        if: always() 

    - name: Upload Windows Test Report XML
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: windows-report-xml
        path: report/windows-report.xml

        
